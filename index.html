  <script>window.BACKSTAGE_CONTENT = {"settings":{"brand":"BACKSTAGE","tagline":"L'actualité de la musique live.","contactEmail":"","instagramUrl":"","publicationNote":"Actualités sourcées, analyses et guides. Aucun reportage sur place sans présence réelle."},"festivals":[{"name":"We Love Green","city":"Paris · Bois de Vincennes","country":"France","genres":"Rock / Pop / Électro","url":"https://www.welovegreen.fr/","code":"WLG","dates":"4–6 juin 2027","editionYear":2027,"lineupStatus":"Premiers noms officiels · dimanche à venir","lineup":[{"day":"Vendredi 4 juin","artists":["Angèle","Lola Young","Adèle Castillon","Amélie Lens","Marlon Hoffstadt","Wallows"]},{"day":"Samedi 5 juin","artists":["Fontaines D.C.","Angine de Poitrine","Boy Harsher","Underscores"]}]},{"name":"Hellfest","city":"Clisson","country":"France","genres":"Metal / Rock","url":"https://hellfest.fr/","code":"HF"},{"name":"Main Square Festival","city":"Arras","country":"France","genres":"Rock / Pop / Électro","url":"https://mainsquarefestival.fr/","code":"MS"},{"name":"Rock en Seine","city":"Saint-Cloud","country":"France","genres":"Rock / Indie","url":"https://www.rockenseine.com/","code":"RS"},{"name":"Dour Festival","city":"Dour","country":"Belgique","genres":"Électro / Rap / Rock","url":"https://www.dourfestival.eu/","code":"DO"},{"name":"Primavera Sound","city":"Barcelone","country":"Espagne","genres":"Indie / Pop / Électro","url":"https://www.primaverasound.com/","code":"PS"},{"name":"Sziget Festival","city":"Budapest","country":"Hongrie","genres":"Multi-genre","url":"https://szigetfestival.com/","code":"SZ"}],"articles":[{"slug":"jeanne-added-tournee-2027","title":"Jeanne Added retrouve la scène en 2027 : trois nuits parisiennes et l'appel du live","excerpt":"De l'Olympia au New Morning, Jeanne Added annonce trois rendez-vous à Paris en mars 2027. Un retour qui traverse rock, jazz et électro, et qui donne aussi une place à la solidarité.","category":"CONCERTS","format":"ACTUALITÉ","date":"2026-10-21","readMinutes":3,"visual":"visual-b","artword":"JEANNE","body":["Il y a des artistes qu'on aurait du mal à enfermer dans une case, et Jeanne Added est de celles-là. Sa voix peut serrer les dents comme un morceau de rock, puis laisser entrer l'air d'une mélodie plus fragile. La retrouver en concert en 2027, c'est surtout une bonne nouvelle pour celles et ceux qui aiment les musiciens qui bougent, changent de direction et refusent de se répéter.","Le programme parisien est désormais posé : jeudi 11 mars à l'Olympia, puis vendredi 12 et samedi 13 mars au New Morning. Trois soirs, deux lieux et deux manières d'imaginer la proximité avec le public. Pas besoin de promettre une soirée historique pour avoir envie de voir comment ces chansons vont respirer sur scène."],"sections":[{"title":"De l'Olympia au New Morning : trois soirs, deux visages","paragraphs":["L'Olympia annonce le premier concert pour le 11 mars à 20 heures, avec des prix affichés entre 36 et 51,90 euros au moment de notre consultation. Le lendemain, le New Morning prend le relais : concert à 20 h 30, ouverture des portes à 19 h 30. Le club confirme également une seconde date le 13 mars. Les tarifs et les disponibilités peuvent évidemment changer ; la bonne adresse reste celle des salles.","Ce passage de l'Olympia à une salle de club a quelque chose de réjouissant. Les concerts ne gagnent pas nécessairement en intensité à mesure que la jauge grandit. Jeanne Added vient du jazz autant que du rock, et cette circulation entre les scènes ressemble assez bien à sa trajectoire."]},{"title":"Le concert comme espace de solidarité","paragraphs":["Il y a aussi un détail qui mérite davantage qu'une ligne perdue dans une annonce de billetterie : le New Morning précise que la totalité des bénéfices des concerts parisiens sera reversée à SOS Méditerranée. La musique n'a pas besoin d'un discours partisan pour rappeler qu'elle peut réunir les gens et soutenir une action concrète.","C'est un choix qui raconte quelque chose de cette série de dates, sans qu'il soit nécessaire de transformer l'article en manifeste. On viendra d'abord pour les chansons, la présence d'une musicienne et le plaisir de retrouver une scène. Le reste donne à ces rendez-vous une résonance supplémentaire."]},{"title":"Et après Paris ?","paragraphs":["Le retour ne s'arrête pas aux frontières du périphérique. La Laiterie, à Strasbourg, annonce Jeanne Added pour le vendredi 9 avril 2027, dans sa grande salle. Le lieu situe lui-même sa musique à la croisée de l'indie rock, de la pop électronique et de la chanson : des étiquettes qui ne disent pas tout, mais donnent une idée de la liberté de mouvement de l'artiste.","Reste l'essentiel, qu'aucune fiche de billetterie ne peut encore nous raconter : ce que Jeanne Added choisira réellement de jouer, de transformer et de partager. Inutile d'inventer la setlist ou de faire comme si on y était déjà. On saura quand les lumières s'éteindront et que la musique commencera."]}],"sources":[{"label":"L'Olympia — concert du 11 mars 2027","url":"https://www.olympiahall.com/agenda/jeanne-added/"},{"label":"New Morning — concerts des 12 et 13 mars 2027","url":"https://www.newmorning.com/20270312-7911-jeanne-added.html"},{"label":"La Laiterie — concert du 9 avril 2027","url":"https://www.artefact.org/la-laiterie/evenements/jeanne-added-2027/"}],"byline":"BACKSTAGE · La rédaction"},{"slug":"toto-tournee-2027-france","title":"Toto annonce une tournée européenne pour ses 50 ans, avec trois passages en France","excerpt":"Bordeaux, Paris et le festival Guitare en Scène figurent parmi les étapes françaises annoncées pour 2027.","category":"CONCERTS","format":"ACTUALITÉ","date":"2026-10-20","readMinutes":3,"visual":"visual-c","artword":"TOTO","body":["Le groupe américain Toto a présenté le 19 octobre sa tournée européenne de l'été 2027, conçue autour de ses cinquante ans d'histoire. Les concerts débuteront en juin et se poursuivront durant l'été, d'après son communiqué officiel.","Pour la France, le média spécialisé InfoConcert annonce trois étapes : Bordeaux, Paris et le festival Guitare en Scène. Cette information concerne des événements à venir, dont les détails doivent toujours être vérifiés auprès des organisateurs et des liens officiels.","Le communiqué du groupe indique que d'autres dates pourront être annoncées et prévoit une mise en vente générale le vendredi 23 octobre, selon les événements. Les horaires précis et les conditions de réservation peuvent varier d'une salle à l'autre.","Cette actualité relève de notre couverture des grandes tournées internationales passant par la France, sans chercher à lister chaque concert local."],"sources":[{"label":"Toto — communiqué officiel du 19 octobre","url":"https://totoofficial.com/2026/10/toto-announces-50th-anniversary-tour-in-europe-planned-for-summer-2027/"},{"label":"InfoConcert — étapes françaises du 20 octobre","url":"https://www.infoconcert.com/actualites/toto-annonce-trois-concerts-en-france-en-2027-dans-le-cadre-leur-tournee-50th-anniversary-bordeaux-paris-et-le-festival-guitare-en-scene-23135"}],"byline":"BACKSTAGE · Sources officielles et presse spécialisée"},{"slug":"we-love-green-premiers-noms-2027","title":"We Love Green 2027 : Fontaines D.C., Angèle et dix premiers noms qui donnent le ton","excerpt":"Deux premières journées déjà très contrastées : pop, rock irlandais, sons électroniques et curiosités qui échappent aux cases. Le festival parisien dévoile sa première vague d'artistes.","category":"FESTIVALS","format":"ACTUALITÉ","date":"2026-10-21","readMinutes":4,"visual":"visual-a","artword":"WLG27","body":["Quand un festival affiche Fontaines D.C. et Angèle sur le même week-end, il annonce tout de suite la couleur : pas question de demander au public de choisir entre guitare et synthé. We Love Green vient de dévoiler les dix premiers artistes de son édition 2027, prévue du 4 au 6 juin au Bois de Vincennes, à Paris. De quoi commencer à imaginer le début de l'été bien avant d'en sentir la chaleur.","Ce qui frappe, c'est moins la collection de noms connus que les rencontres possibles entre des univers qui ne fréquentent pas toujours les mêmes scènes. Le vendredi penche vers la pop et les musiques électroniques ; le samedi laisse davantage de place aux guitares sombres, aux expérimentations et aux chemins de traverse. C'est précisément là qu'un festival peut devenir intéressant : quand on vient pour un artiste et qu'on repart avec trois découvertes."],"sources":[{"label":"We Love Green — programmation officielle 2027","url":"https://www.welovegreen.fr/"}],"byline":"BACKSTAGE · La rédaction","sections":[{"title":"Vendredi 4 juin : Angèle, Lola Young et les grands écarts de la pop","paragraphs":["Angèle est annoncée le vendredi, aux côtés de Lola Young et d'Adèle Castillon. Dans la même journée figurent aussi Wallows, Amélie Lens et Marlon Hoffstadt. Autrement dit, une soirée qui peut faire passer les festivaliers d'une chanson à une énergie franchement club, sans considérer qu'il existerait une frontière infranchissable entre les deux.","Le festival n'a pas encore publié ici de déroulé horaire des concerts : inutile donc d'inventer un ordre de passage ou de promettre des enchaînements précis. Pour l'instant, ce sont six noms confirmés, et déjà plusieurs manières d'écouter la même journée."]},{"title":"Samedi 5 juin : Fontaines D.C., Angine de Poitrine et le rock qui déborde","paragraphs":["Le samedi, les Irlandais de Fontaines D.C. partagent l'affiche annoncée avec Angine de Poitrine, Boy Harsher et Underscores. C'est la journée qui retiendra particulièrement l'attention de ceux qui aiment voir le rock sortir de ses habitudes, frotter ses guitares aux machines et refuser de rester sage.","Fontaines D.C. incarne cette envie de musique tendue, pleine de nerf. À l'autre bout des attentes, les noms d'Angine de Poitrine, de Boy Harsher ou d'Underscores promettent surtout une chose : une programmation qui ne se limite pas à empiler des têtes d'affiche interchangeables. Il restera à voir sur scène comment tout cela prendra forme."]},{"title":"Et le dimanche ? La suite n'est pas encore annoncée","paragraphs":["Pour le dimanche 6 juin, le site officiel affiche encore « Coming soon ». C'est une information en soi : la programmation révélée ne représente qu'une première vague. Mieux vaut laisser un peu de place au suspense plutôt que remplir les blancs avec des rumeurs.","La billetterie est désormais ouverte sur le site officiel de We Love Green. Les tarifs, catégories de pass et disponibilités évoluent : pour réserver, il faut donc se fier aux informations mises à jour par l'organisateur plutôt qu'à une capture d'écran qui circule depuis plusieurs jours."]},{"title":"Un festival qui veut aussi parler du monde","paragraphs":["We Love Green ne met pas seulement des groupes à l'affiche. Le festival revendique un lien entre musique, conférences, restauration et engagement environnemental. Cet ADN ne remplace évidemment pas la qualité des concerts, mais il donne un contexte particulier aux trois journées du Bois de Vincennes.","Le plus réjouissant dans cette première annonce reste sa curiosité. Le rock y est bien présent, sans exiger que tout le reste se taise. Pour un public prêt à circuler entre les genres, c'est une assez bonne manière de commencer l'été."]}],"updatedAt":"2026-10-21T18:21:34Z"},{"slug":"oasis-paris-2027","title":"Oasis : les dates françaises de 2027 fixées aux 20 et 23 juillet","excerpt":"Les frères Gallagher sont attendus au Stade de France. Les dates ont changé depuis l'annonce initiale.","category":"CONCERTS","format":"ACTUALITÉ","date":"2026-10-20","readMinutes":3,"visual":"visual-b","artword":"OASIS","body":["Après leur tournée de retrouvailles de 2025, Oasis prépare une nouvelle série de concerts en 2027, en Europe, au Royaume-Uni et aux États-Unis.","Le calendrier officiel du groupe donne deux rendez-vous à Paris, au Stade de France, les 20 et 23 juillet 2027. Le stade confirme que les dates parisiennes ont été modifiées à cause de travaux ferroviaires prévus à proximité le 24 juillet. Certaines annonces de septembre mentionnaient donc un calendrier désormais dépassé.","Oasis indique que les billets sont épuisés. Le groupe précise que la revente éventuelle sera proposée par ses canaux annoncés, Ticketmaster et Twickets. Le public doit vérifier directement les conditions et disponibilités.","Ce type de changement montre pourquoi notre rédaction confronte les annonces de presse aux communications des artistes et des organisateurs."],"sources":[{"label":"Oasis — calendrier officiel","url":"https://www.oasisinet.com/live/"},{"label":"Stade de France — dates actualisées","url":"https://www.stadefrance.com/en/groups/ticket/oasis"}],"byline":"BACKSTAGE · Sources officielles"},{"slug":"hellfest-2027-dates-revente","title":"Hellfest 2027 : rendez-vous du 17 au 20 juin, la revente officielle ouverte","excerpt":"Le festival de Clisson affiche les dates de son édition 2027 et renvoie vers sa billetterie officielle.","category":"FESTIVALS","format":"ACTUALITÉ","date":"2026-10-20","readMinutes":3,"visual":"visual-a","artword":"HF27","body":["L'édition 2027 du Hellfest se tiendra à Clisson du 17 au 20 juin. Le festival présente déjà sur son site les principales informations pratiques concernant ses quatre journées.","Au moment de notre consultation, le site affiche un tarif de 389 € pour le pass quatre jours. Ce tarif indicatif ne garantit pas qu'un pass soit actuellement disponible.","Le festival annonce l'ouverture de sa revente officielle sur tickets.hellfest.fr. Pour éviter les annonces trompeuses ou les faux billets, les transactions doivent être vérifiées auprès des canaux reconnus par l'organisateur.","Les pronostics de fans ne constituent pas une programmation confirmée. Nous n'annoncerons des artistes que lorsque le festival ou leurs représentants auront communiqué officiellement."],"sources":[{"label":"Hellfest — site officiel","url":"https://hellfest.fr/"}],"byline":"BACKSTAGE · Informations vérifiées"},{"slug":"stevie-wonder-paris-2026","title":"Stevie Wonder a célébré ses 50 ans de Songs in the Key of Life à Paris","excerpt":"Le musicien s'est produit à l'Accor Arena le 15 octobre 2026 pour une soirée consacrée à son album de 1976.","category":"CONCERTS","format":"ACTUALITÉ","date":"2026-10-20","readMinutes":2,"visual":"visual-c","artword":"SOUL","body":["Stevie Wonder a donné un concert le 15 octobre 2026 à l'Accor Arena de Paris, à l'occasion du cinquantième anniversaire de son double album Songs in the Key of Life.","L'événement figurait dans sa tournée anniversaire annoncée par la salle. Le Monde a publié un compte rendu daté du 16 octobre qui confirme la tenue de cette prestation.","Nous ne présentons pas cette synthèse comme un reportage réalisé sur place : nos informations proviennent de l'organisateur et d'un compte rendu de presse identifié."],"sources":[{"label":"Accor Arena — programmation officielle","url":"https://www.accorarena.com/fr/programmation/stevie-wonder--1b0e7"},{"label":"Le Monde — compte rendu du 16 octobre","url":"https://www.lemonde.fr/en/culture/article/2026/10/16/stevie-wonder-rediscovers-the-key-to-his-genius-at-paris-concert_6758674_30.html"}],"byline":"BACKSTAGE · Synthèse de sources publiées"},{"slug":"revente-billets-concerts","title":"Revente de billets : ce qu'il faut vérifier avant d'acheter un concert complet","excerpt":"Billets nominatifs, doublons, frais, rétractation : enquête documentaire sur les pièges de la revente et les moyens de les éviter.","category":"SOCIÉTÉ","format":"DÉCRYPTAGE","date":"2026-10-20","readMinutes":5,"visual":"visual-d","artword":"TICKET","body":["Un concert très attendu affiche complet, mais des annonces de revente apparaissent immédiatement sur Internet. L'offre peut rendre service à un spectateur empêché. Elle peut aussi exposer l'acheteur à un billet inutilisable ou vendu beaucoup trop cher. Le vrai enjeu n'est donc pas simplement de trouver une place : c'est de savoir ce que l'on achète, à qui et avec quelles garanties.","Pour comprendre les précautions utiles, nous avons rapproché les règles expliquées par la DGCCRF et la réponse apportée par le ministère de l'Économie à une question parlementaire sur la revente. Ces textes distinguent trois sujets trop souvent mélangés : les conditions fixées par l'organisateur, le droit applicable à la revente et les pratiques des plateformes."],"sources":[{"label":"DGCCRF — réglementation et risques de la revente (20 avril 2026)","url":"https://www.economie.gouv.fr/dgccrf/les-fiches-pratiques/revente-de-billets-de-spectacles-ou-de-competitions-sportives"},{"label":"Sénat — réponse du ministère de l'Économie (5 juin 2025)","url":"https://www.senat.fr/questions/base/2024/qSEQ241000803.html"}],"byline":"BACKSTAGE · Décryptage","sections":[{"title":"Un billet n'est pas toujours transférable","paragraphs":["Un billet donne accès à un événement selon les conditions fixées lors de sa vente. Certains sont nominatifs, d'autres sont transmis sous forme numérique, parfois avec des règles particulières de changement de titulaire. Le fait qu'un fichier PDF circule librement ne prouve pas qu'il permettra d'entrer.","La réponse du ministère de l'Économie publiée au Sénat le 5 juin 2025 rappelle que l'organisateur peut déterminer des modalités de revente et d'accès, à condition que les règles contractuelles soient clairement présentées avant l'achat. Première vérification : consulter le règlement du concert concerné, plutôt qu'une réponse générale trouvée sur un forum."]},{"title":"La revente entre particuliers n'est pas automatiquement interdite","paragraphs":["Selon la DGCCRF, la revente occasionnelle entre particuliers est en principe possible, sous réserve des restrictions propres au billet. En revanche, revendre de manière habituelle sans l'autorisation de l'organisateur ou du producteur est interdit par l'article 313-6-2 du code pénal.","Il existe également une règle particulière pour certains événements subventionnés : le prix de revente ne peut pas excéder le prix initialement fixé et affiché, dans les conditions détaillées par la DGCCRF. Il ne faut donc pas confondre la possibilité de céder sa place et la liberté de fixer n'importe quel prix."]},{"title":"Le prix affiché ne raconte pas toute l'histoire","paragraphs":["Sur certaines plateformes, des frais s'ajoutent au tarif de départ. Comparer uniquement deux prix mis en avant peut donc être trompeur. L'acheteur doit regarder le montant total, la catégorie de place et les éventuelles restrictions. Le vendeur, de son côté, doit comprendre ce qu'il recevra après déduction des frais.","La DGCCRF énumère aussi plusieurs risques concrets : billet revendu plusieurs fois, fichier falsifié, catégorie non conforme à l'annonce ou place jamais livrée. Une preuve de paiement ne garantit pas la validité du billet lors du contrôle à l'entrée."]},{"title":"Notre méthode pour vérifier une annonce de revente","paragraphs":["Commencer par la page officielle de l'événement et rechercher une éventuelle bourse aux billets recommandée par l'organisateur. Vérifier ensuite le caractère nominatif du titre, les conditions de transfert, le prix final et les informations légales sur le vendeur ou la plateforme. Un site au design soigné n'est pas, à lui seul, un gage de fiabilité.","Autre point souvent oublié : un billet de spectacle ne bénéficie généralement pas du droit de rétractation de quatorze jours applicable à de nombreux achats à distance. Il est donc risqué de l'acheter avec l'idée de changer d'avis ensuite. Les assurances annulation peuvent également comporter des exclusions.","En cas de pratique commerciale problématique, la DGCCRF renvoie notamment vers SignalConso. En présence d'éléments laissant penser à une escroquerie, les démarches auprès de la police ou de la gendarmerie relèvent d'une autre procédure. Conserver les échanges et les justificatifs est alors une précaution utile."]},{"title":"Ce que la revente raconte du spectacle vivant","paragraphs":["Les tensions autour de la revente révèlent un décalage entre une demande parfois très concentrée sur quelques dates et le nombre de places disponibles. Les organisateurs tentent d'y répondre par des règles de transfert, des canaux de revente spécifiques ou des contrôles renforcés à l'entrée. Mais ces dispositifs peuvent eux-mêmes compliquer la vie des acheteurs qui ont un empêchement légitime.","La question mérite donc mieux qu'un simple classement des plateformes : qui peut accéder au concert, comment les prix sont-ils présentés et quelles protections restent effectives une fois la place achetée ? Ce sont des sujets que BACKSTAGE continuera de suivre, en distinguant les règles établies des choix commerciaux de chaque événement."]}]},{"slug":"tarification-dynamique-concerts","title":"Tarification dynamique : pourquoi le prix des concerts fait débat","excerpt":"L'accès aux grands spectacles et l'évolution des prix selon la demande ont fait l'objet d'échanges au Sénat en 2026.","category":"SOCIÉTÉ","format":"DÉCRYPTAGE","date":"2026-10-20","readMinutes":3,"visual":"visual-b","artword":"PRIX","body":["Quand la demande explose pour un concert, certains modes de tarification permettent aux prix de varier. Cette pratique soulève des questions de transparence et d'accessibilité aux événements.","La filière musicale et la tarification dynamique ont fait l'objet d'une question au gouvernement au Sénat le 15 avril 2026, avec une question et une réponse publiées le 16 avril.","Il faut différencier la tarification dynamique des frais de service et des prix pratiqués sur les plateformes de revente : ces mécanismes ne sont pas identiques.","BACKSTAGE entend traiter ces enjeux à partir de documents vérifiables et, à terme, de témoignages recueillis directement, plutôt que de transformer une opinion en fait."],"sources":[{"label":"Sénat — question et réponse du 16 avril 2026","url":"https://www.senat.fr/questions/base/2026/qSEQ26040803G.html"}],"byline":"BACKSTAGE · Analyse"},{"slug":"bien-preparer-festival","title":"Avant un festival : les vérifications qui changent vraiment l'expérience","excerpt":"Transports, horaires, règlement, audition : un guide pratique pour préparer une journée de musique live.","category":"GUIDES","format":"GUIDE","date":"2026-10-20","readMinutes":3,"visual":"visual-a","artword":"GUIDE","body":["Préparer un festival, c'est regarder autre chose que l'affiche : les horaires des scènes, l'accès au lieu et les conditions pratiques sont essentiels.","Consulte toujours le règlement officiel de l'édition pour connaître les sacs, contenants et objets autorisés. Prévois une protection auditive adaptée aux concerts.","Anticipe ton trajet de retour, notamment si le dernier concert se termine après la fin des transports publics. Tu profiteras davantage de la soirée en connaissant tes options.","Garde aussi du temps pour une découverte inattendue : une première partie ou un artiste inconnu peut devenir le souvenir le plus marquant."],"sources":[],"byline":"BACKSTAGE · Guide original"}]};</script>
  <script>(() => {
'use strict';
const db = window.BACKSTAGE_CONTENT || {settings:{},articles:[],festivals:[]};
const settings = db.settings || {};
const articleTime = a => Date.parse(a.updatedAt || (String(a.date)+'T00:00:00Z')) || 0;
const articles = [...db.articles].sort((a,b) => articleTime(b)-articleTime(a));
const festivals = db.festivals || [];
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ext = u => /^https:\/\//.test(String(u||'')) ? u : '#/festivals';
const prettyDate = s => {try{return new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(`${s}T12:00:00Z`));}catch{return s}};
const nav = [ ['#/','À la une'], ['#/magazine','Actualités'], ['#/festivals','Festivals'], ['#/societe','Société'], ['#/dossiers','Dossiers'] ];
let menuOpen = false;
function header(current){return `<header class="sitehead"><div class="container headinner"><a class="logo" href="#/" aria-label="BACKSTAGE, accueil">${esc(settings.brand || 'BACKSTAGE')}<span></span></a><nav class="nav ${menuOpen?'open':''}" aria-label="Navigation principale">${nav.map(([url,title])=>`<a href="${url}" ${current===url?'aria-current="page"':''}>${title}</a>`).join('')}<a class="headcta" href="#/professionnels">Espace professionnel <span aria-hidden="true">↗</span></a></nav><a class="headcta" href="#/professionnels">Espace professionnel <span aria-hidden="true">↗</span></a><button class="menu-toggle" id="menu-toggle" aria-expanded="${menuOpen}" aria-controls="mobile-nav">${menuOpen?'Fermer':'Menu ☰'}</button></div></header>`}
function footer(){const mail=settings.contactEmail?`<a href="mailto:${esc(settings.contactEmail)}">${esc(settings.contactEmail)}</a>`:'<span>Contact professionnel à configurer</span>';return `<footer class="footer"><div class="container"><div class="footer-grid"><div><a class="logo" href="#/">${esc(settings.brand||'BACKSTAGE')}<span></span></a><p>Média indépendant consacré aux concerts, aux festivals et aux cultures live. Sans frontières, sans fausses exclusivités.</p></div><div><h4>Explorer</h4><div class="footlinks"><a href="#/magazine">Actualités</a><a href="#/festivals">Festivals</a><a href="#/societe">Société</a><a href="#/dossiers">Dossiers</a><a href="#/methode">Notre méthode</a></div></div><div><h4>Professionnels</h4><div class="footlinks"><a href="#/professionnels">Collaborations</a>${mail}${settings.instagramUrl?`<a href="${esc(ext(settings.instagramUrl))}" rel="noopener noreferrer" target="_blank">Instagram ↗</a>`:''}</div></div></div><div class="footer-bottom"><span>© ${new Date().getFullYear()} ${esc(settings.brand||'BACKSTAGE')} — Tous droits réservés.</span><span>Contenus originaux · Sources identifiées · Indépendance éditoriale</span></div></div></footer>`}
function media(a){return `<div class="article-media ${esc(a.visual||'visual-d')}"><div class="image-label">${esc(a.category||'MAGAZINE')}</div><span aria-hidden="true" class="image-type">${esc(a.artword||'LIVE')}</span></div>`}
function card(a){return `<a class="article-card" href="#/article/${encodeURIComponent(a.slug)}">${media(a)}<div class="article-text"><div class="article-meta">${esc(a.category)} <span>•</span> ${esc(a.format||"ÉDITORIAL")} <span>•</span> ${esc(prettyDate(a.date))}${a.updatedAt?` <span>•</span> <span class="article-updated">Mis à jour</span>`:""}</div><h3 class="article-title">${esc(a.title)}</h3><p class="article-excerpt">${esc(a.excerpt)}</p><div class="card-bottom"><span>${Number(a.readMinutes)||3} min de lecture</span><span class="roundarrow" aria-hidden="true">↗</span></div></div></a>`}
function festCard(f){const lines=Array.isArray(f.lineup)?f.lineup:[];return `<article class="festcard"><div class="festtop"><span>${esc(f.country)}</span><span>${esc(f.code||'LIVE')}</span></div><div><h3>${esc(f.name)}</h3><p>${esc(f.city)} · ${esc(f.genres)}</p>${f.dates?`<p class="festdates">${esc(f.dates)}</p>`:''}${lines.length?`<details class="festlineup"><summary>Programmation confirmée</summary>${lines.map(d=>`<div class="festday"><strong>${esc(d.day)}</strong><p>${(d.artists||[]).map(esc).join(' · ')}</p></div>`).join('')}${f.lineupStatus?`<p class="feststatus">${esc(f.lineupStatus)}</p>`:''} </details>`:''}<a href="${esc(ext(f.url))}" target="_blank" rel="noopener noreferrer">Site officiel ↗</a></div></article>`}
function homescreen(){return `<section class="hero"><div class="container hero-grid"><div><div class="eyebrow">ACTU · FESTIVALS · CONCERTS · SOCIÉTÉ</div><h1>L'actualité<br/><em>de la</em><br/>musique live.</h1><p class="hero-intro">Festivals, tournées majeures, retours de groupes mythiques et sujets de société : l'information qui compte pour celles et ceux qui vivent la musique sur scène.</p><div class="hero-actions"><a class="btn btn-primary" href="#/magazine">Explorer le magazine <span aria-hidden="true">↗</span></a><a class="btn btn-secondary" href="#/festivals">Découvrir les festivals</a></div><div class="subnote"><span class="dot" aria-hidden="true"></span> Indépendant · Curieux · International</div></div><div class="hero-art" role="img" aria-label="Visuel graphique original évoquant les faisceaux lumineux d'un concert et une foule"><div class="stage-beams"><span class="beam one"></span><span class="beam two"></span><span class="beam three"></span></div><div class="crowd"></div><div class="art-top"><span>LIVE CULTURE JOURNAL</span><span>001 / ∞</span></div><div class="poster-word"><span>FEEL</span><span>THE</span><span>MUSIC.</span></div><div class="vertical-text">BE THERE. FEEL MORE.</div></div></div></section><div class="ticker"><div class="container tickerinner"><span>NO FRONTIERS</span><b>✳</b><span>ONLY LIVE MUSIC</span><b>✳</b><span>DISCOVER MORE</span><b>✳</b><span>FEEL EVERYTHING</span></div></div><section class="section"><div class="container"><div class="section-head"><div><span class="overline">Les dernières publications</span><h2>À la une<span style="color:var(--accent)">.</span></h2></div><a class="linkmore" href="#/magazine">Toute l’actualité ↗</a></div><div class="article-grid">${articles.slice(0,3).map(card).join('') || '<p class="empty">Premiers articles à venir.</p>'}</div></div></section><section class="section dark-band"><div class="container"><div class="section-head"><div><span class="overline">Économie, accès et coulisses</span><h2>Live & société<span style="color:var(--accent)">.</span></h2></div><a class="linkmore" href="#/societe">Tous les décryptages ↗</a></div><div class="article-grid">${articles.filter(a=>a.category==='SOCIÉTÉ').map(card).join('')}</div></div></section><section class="section"><div class="container"><div class="section-head"><div><span class="overline">Notre ADN</span><h2>Vivre. Écouter. Raconter<span style="color:var(--accent)">.</span></h2></div></div>${methods()}</div></section>${proCall()}`}
function methods(){return `<div class="method-grid"><div class="method"><span class="num">01 /</span><h3>Le live d'abord.</h3><p>Festivals, concerts en salle et découvertes : raconter la musique sur scène sans se limiter aux têtes d'affiche.</p></div><div class="method"><span class="num">02 /</span><h3>Des sources claires.</h3><p>Les annonces factuelles renvoient à leurs sources. Aucune interview ou présence sur place n'est inventée.</p></div><div class="method"><span class="num">03 /</span><h3>La curiosité partout.</h3><p>Priorité à la France et aux pays voisins, sans manquer les événements mondiaux majeurs.</p></div></div>`}
function proCall(){return `<div class="container"><div class="pro-call"><div><span class="overline" style="color:#3f4c26">Festivals · Organisateurs · Partenaires</span><h2>Faisons vibrer la scène ensemble.</h2><p>Festivals, concerts et scènes émergentes : des contenus utiles pour celles et ceux qui vivent la musique en direct.</p></div><a href="#/professionnels" class="btn">Collaborer avec nous ↗</a></div></div>`}
function magazine(){return `<section class="container"><div class="page-heading"><span class="overline">Chroniques / idées / annonces sourcées</span><h1>Le magazine<span style="color:var(--accent)">.</span></h1><p>Actualités, analyses et guides de la musique live. Chaque sujet est sélectionné pour son intérêt et chaque information importante renvoie à une source vérifiable.</p><label for="search-articles" class="subnote">Rechercher un article</label><input class="search" id="search-articles" type="search" placeholder="Artiste, festival, sujet…" autocomplete="off" /></div><div id="article-results" class="article-grid" style="margin:5px 0 80px">${articles.map(card).join('')}</div></section>`}
function festivalsPage(){const countries=['Tous',...new Set(festivals.map(f=>f.country))];return `<section class="container"><div class="page-heading"><span class="overline">Une scène sans limites</span><h1>Les festivals<span style="color:var(--accent)">.</span></h1><p>Nos dernières actualités festivals, avec une sélection de rendez-vous internationaux et des liens vers leurs sites officiels.</p></div><div class="article-grid" style="margin-bottom:45px">${articles.filter(a=>a.category==='FESTIVALS').map(card).join('')}</div><h2 style="margin-bottom:20px">Festivals à suivre</h2><div class="filterbar" id="country-filter">${countries.map((c,i)=>`<button class="chip ${i===0?'active':''}" data-country="${esc(c)}" aria-pressed="${i===0}">${esc(c)}</button>`).join('')}</div><div class="festival-grid" id="festival-results" style="margin-bottom:50px">${festivals.map(festCard).join('')}</div><p class="notice" style="margin-bottom:85px">Cette sélection n'indique ni dates ni disponibilités de billets. Consultez le site officiel de chaque événement.</p></section>`}
function concertsPage(){return `<section class="container"><div class="page-heading"><span class="overline">Grands concerts et tournées</span><h1>Les concerts<span style="color:var(--accent)">.</span></h1><p>Les annonces qui comptent, des retours attendus aux tournées internationales.</p></div><div class="article-grid" style="margin:40px 0 85px">${articles.filter(a=>a.category==='CONCERTS').map(card).join('')}</div></section>`}
function societePage(){return `<section class="container"><div class="page-heading"><span class="overline">Le live, fait de société</span><h1>Live & société<span style="color:var(--accent)">.</span></h1><p>Prix des billets, économie des concerts, accessibilité, conditions de travail et enjeux du spectacle vivant.</p></div><div class="article-grid" style="margin:40px 0 85px">${articles.filter(a=>a.category==='SOCIÉTÉ').map(card).join('')}</div></section>`}
function dossiersPage(){return `<section class="container"><div class="page-heading"><span class="overline">Guides, décryptages, reportages</span><h1>Les dossiers<span style="color:var(--accent)">.</span></h1><p>Des guides utiles et des analyses approfondies. Les reportages reposeront sur des faits observés, des documents ou des témoignages réellement recueillis.</p></div><div class="article-grid" style="margin:40px 0 60px">${articles.filter(a=>a.format==='GUIDE'||a.format==='DÉCRYPTAGE').map(card).join('')}</div><p class="notice" style="margin-bottom:70px">Aucun reportage fictif ni témoignage inventé.</p></section>`}
function methodPage(){return `<section class="container"><div class="page-heading"><span class="overline">Notre charte éditoriale</span><h1>Indépendants.<br/>Et responsables<span style="color:var(--accent)">.</span></h1><p>Nous privilégions les festivals, tout en suivant les concerts, les salles et les artistes. Nous voulons traiter chaque sujet avec le contexte, les sources et la précision qu'il mérite.</p></div><div class="method-grid" style="margin:25px 0 60px">${methods().replace('<div class="method-grid">','').replace(/<\/div>$/,'')}</div><div class="pro-layout"><div class="pro-panel"><h3>Notre façon de travailler</h3><ul><li>Nous surveillons les annonces des artistes, des organisateurs et des médias spécialisés.</li><li>Nous privilégions les documents de première main et recoupons les informations importantes.</li><li>Une brève doit aller à l'essentiel ; un dossier doit apporter du contexte, des explications et des perspectives utiles.</li><li>Les sources utilisées sont identifiées et les erreurs sont corrigées.</li></ul></div><div class="pro-panel"><h3>Notre indépendance</h3><p>Une invitation ou une collaboration n'achète pas une critique favorable. Les partenariats éventuels sont signalés. Nous ne nous présentons jamais comme média accrédité par un événement sans accord réel.</p><p>Aucun compte-rendu « sur place » n'est publié si aucun membre de l'équipe n'y a assisté.</p></div></div></section>`}
function proPage(){const c = settings.contactEmail;return `<section class="container"><div class="page-heading"><span class="overline">Relations professionnelles</span><h1>Parlons musique,<br/>parlons projets<span style="color:var(--accent)">.</span></h1><p>Nous développons un média indépendant sur les festivals, les concerts, les salles et les artistes. Collaborations éditoriales étudiées au cas par cas.</p></div><div class="pro-layout"><div class="pro-panel"><h3>Ce que nous pouvons proposer</h3><ul><li>Présentation d'une programmation à partir de sources officielles.</li><li>Portraits et découvertes d'artistes avec sources identifiées.</li><li>Guides pratiques et sélections éditoriales.</li><li>Couverture d'événement sur place, uniquement si elle est convenue et effectivement réalisée.</li></ul><p>Les livrables, délais et accès sont définis d'un commun accord selon les moyens réellement disponibles.</p></div><div class="pro-panel"><h3>Construisons une collaboration</h3><p>Organisateur, agence, salle ou festival : parlons de vos actualités et des formats qui apporteraient de la valeur au public.</p><div class="pro-contact">${c?`<p>Écrivez-nous pour discuter d'un projet :</p><a class="btn btn-primary" href="mailto:${esc(c)}?subject=${encodeURIComponent('Proposition de collaboration éditoriale')}">Prendre contact ↗</a>`:`<p>Coordonnées professionnelles en cours de configuration.</p><span class="hint">Le média est en préparation. Le contact sera publié au lancement.</span>`}</div><p class="notice">Toute invitation ou prise en charge en lien avec une publication sera indiquée, conformément à notre charte.</p></div></div></section>`}
function articlePage(slug){
 const a=articles.find(x=>x.slug===slug);
 if(!a)return `<div class="container page-heading"><h1>Article introuvable.</h1><p><a href="#/magazine">Retour au magazine</a></p></div>`;
 const sections=(a.sections||[]).map(s=>`<section class="article-chapter"><h2>${esc(s.title)}</h2>${(s.paragraphs||[]).map(p=>`<p class="bodypara">${esc(p)}</p>`).join('')}</section>`).join('');
 const sources=(a.sources||[]).filter(s=>s.url&&s.label);
 const sourceMarkup=sources.length
   ? `<details class="sources-note"><summary>Sources (${sources.length})</summary><ul>${sources.map(s=>`<li><a href="${esc(ext(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.label)} ↗</a></li>`).join('')}</ul></details>`
   : '';
 return `<article class="longread"><a href="#/magazine" class="back">← Retour aux actualités</a><div class="article-meta" style="margin-top:30px">${esc(a.category)} <span>•</span> ${esc(a.format||"ÉDITORIAL")} <span>•</span> ${esc(prettyDate(a.date))}${a.updatedAt?` <span>•</span> Mis à jour le ${esc(prettyDate(a.updatedAt.slice(0,10)))}`:""} <span>•</span> ${Number(a.readMinutes)||3} min</div><h1>${esc(a.title)}</h1><p class="deck">${esc(a.excerpt)}</p>${media(a)}<div>${(a.body||[]).map(p=>`<p class="bodypara">${esc(p)}</p>`).join('')}</div>${sections}${sourceMarkup}</article>`;
}
function render(){const hash = decodeURIComponent(location.hash.replace(/^#/,'')) || '/';const current = hash.startsWith('/article/')?'#/magazine':`#${hash}`;let page = homescreen();if(hash==='/magazine')page=magazine();else if(hash==='/festivals')page=festivalsPage();else if(hash==='/concerts')page=concertsPage();else if(hash==='/societe')page=societePage();else if(hash==='/dossiers')page=dossiersPage();else if(hash==='/methode')page=methodPage();else if(hash==='/professionnels')page=proPage();else if(hash.startsWith('/article/'))page=articlePage(hash.slice(9));app.innerHTML=header(current)+`<main id="main">${page}</main>`+footer();document.title = hash==='/'?`${settings.brand||'BACKSTAGE'} — Le live, sans frontières`:`${hash.startsWith('/article/')?(articles.find(a=>a.slug===hash.slice(9))?.title||'Article'):hash==='/magazine'?'Magazine':hash==='/festivals'?'Festivals':hash==='/methode'?'Notre méthode':'Professionnels'} | ${settings.brand||'BACKSTAGE'}`;document.getElementById('menu-toggle')?.addEventListener('click',()=>{menuOpen=!menuOpen;document.querySelector('.nav')?.classList.toggle('open',menuOpen);document.getElementById('menu-toggle').setAttribute('aria-expanded',String(menuOpen));document.getElementById('menu-toggle').textContent=menuOpen?'Fermer':'Menu ☰'});document.querySelectorAll('.nav a').forEach(e=>e.addEventListener('click',()=>menuOpen=false));const search=document.getElementById('search-articles');if(search) search.addEventListener('input',()=>{const term=search.value.trim().toLocaleLowerCase('fr');const matched=articles.filter(a=>[a.title,a.excerpt,a.category].join(' ').toLocaleLowerCase('fr').includes(term));document.getElementById('article-results').innerHTML=matched.length?matched.map(card).join(''):'<p class="empty">Aucun article pour cette recherche.</p>'});document.querySelectorAll('[data-country]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-country]').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});b.classList.add('active');b.setAttribute('aria-pressed','true');const c=b.getAttribute('data-country');const matched=festivals.filter(f=>c==='Tous'||f.country===c);document.getElementById('festival-results').innerHTML=matched.map(festCard).join('')}))}
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'})});render();
})();
</script>
</body>
</html>
