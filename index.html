  <script>window.BACKSTAGE_CONTENT = {"settings":{"brand":"BACKSTAGE","tagline":"Le live, sans frontières.","contactEmail":"","instagramUrl":"","publicationNote":"Les contenus d'actualité sont vérifiés par la rédaction avant publication. Leurs sources d'origine sont indiquées."},"festivals":[{"name":"Hellfest","city":"Clisson","country":"France","genres":"Metal / Rock","url":"https://hellfest.fr/","code":"HF"},{"name":"Main Square Festival","city":"Arras","country":"France","genres":"Rock / Pop / Électro","url":"https://mainsquarefestival.fr/","code":"MS"},{"name":"Rock en Seine","city":"Saint-Cloud","country":"France","genres":"Rock / Indie","url":"https://www.rockenseine.com/","code":"RS"},{"name":"Dour Festival","city":"Dour","country":"Belgique","genres":"Électro / Rap / Rock","url":"https://www.dourfestival.eu/","code":"DO"},{"name":"Primavera Sound","city":"Barcelone","country":"Espagne","genres":"Indie / Pop / Électro","url":"https://www.primaverasound.com/","code":"PS"},{"name":"Sziget Festival","city":"Budapest","country":"Hongrie","genres":"Multi-genre","url":"https://szigetfestival.com/","code":"SZ"}],"articles":[{"slug":"festival-experience","title":"Au-delà de la scène : ce qui rend un festival mémorable","excerpt":"Scénographie, rencontres, atmosphère : regarder le live autrement, sans se limiter à la tête d'affiche.","category":"CULTURE LIVE","date":"2026-10-20","readMinutes":3,"visual":"visual-b","artword":"LOUD","body":["Il est tentant de juger un festival à la seule lecture de sa programmation. Pourtant, deux événements avec une affiche proche peuvent procurer des expériences complètement différentes.","La façon dont les scènes sont disposées, les moments de transition entre les concerts, l'accueil du public et la place laissée aux découvertes jouent un rôle essentiel dans le souvenir qu'on en garde.","Pour choisir un festival, regarde donc aussi ses informations pratiques, ses espaces accessibles au public, les possibilités de transport et le nombre de scènes. Le meilleur événement n'est pas nécessairement le plus grand : c'est celui qui correspond à la manière dont tu aimes vivre la musique.","Notre parti pris : raconter les festivals dans leur ensemble, des grands noms aux détails qui changent concrètement l'expérience d'un spectateur."],"sources":[],"byline":"La rédaction · Éditorial"},{"slug":"premier-festival","title":"Premier festival : les bons réflexes pour profiter du live","excerpt":"Préparer l'essentiel, découvrir de nouveaux artistes et garder du temps pour l'imprévu : notre méthode simple.","category":"GUIDES","date":"2026-10-20","readMinutes":4,"visual":"visual-a","artword":"LIVE","body":["Un festival n'est pas seulement une succession de concerts. C'est aussi une manière de découvrir des artistes qu'on n'aurait jamais écoutés autrement, de circuler entre plusieurs scènes et de vivre la musique avec d'autres personnes.","Avant de partir, consulte le site officiel de l'événement : horaires, conditions d'accès, moyens de paiement, restrictions sur les sacs et possibilités de transport. Les règles changent d'un festival à l'autre et d'une édition à la suivante.","Construis un programme souple. Choisis deux ou trois concerts incontournables, puis garde volontairement des plages libres. Les meilleures découvertes arrivent parfois en suivant simplement ce que tu entends au loin.","Prends de quoi protéger ton audition, une batterie externe si elle est autorisée, et des vêtements adaptés à la météo. Pour l'eau, la nourriture et les contenants, vérifie toujours le règlement du festival.","Enfin, prévois ton retour avant le dernier concert. Vérifie les trains, navettes et zones de sortie : la meilleure fin de soirée, c'est celle où tu sais déjà comment rentrer."],"sources":[],"byline":"La rédaction · Guide original"},{"slug":"decouvrir-artistes","title":"Comment repérer les artistes à ne pas manquer avant un festival","excerpt":"Une méthode rapide pour explorer une programmation, même lorsqu'on ne connaît qu'un quart des noms.","category":"DÉCOUVERTES","date":"2026-10-20","readMinutes":3,"visual":"visual-c","artword":"NEW","body":["Une affiche de festival peut ressembler à une liste interminable de noms. Pour y voir plus clair, commence par repérer quelques artistes qui ressemblent à ceux que tu écoutes déjà, sans t'enfermer dans un seul style.","Sélectionne dix noms au hasard dans la programmation officielle. Écoute un morceau studio et, lorsque c'est possible, un extrait de prestation en direct. Certains artistes prennent une toute autre dimension sur scène.","Classe ensuite tes découvertes en trois groupes : incontournables, curiosités et surprises possibles. Tu obtiens un itinéraire personnel sans avoir besoin d'écouter l'intégralité de la programmation.","Laisse enfin une part au hasard. Il n'est pas indispensable de tout connaître à l'avance : découvrir un groupe pour la première fois devant une scène peut être une excellente surprise."],"sources":[],"byline":"La rédaction · Guide original"}]};</script>
  <script>(() => {
'use strict';
const db = window.BACKSTAGE_CONTENT || {settings:{},articles:[],festivals:[]};

const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ext = u => /^https:\/\//.test(String(u||'')) ? u : '#/festivals';
const prettyDate = s => {try{return new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(`${s}T12:00:00Z`));}catch{return s}};
const nav = [ ['#/','À la une'], ['#/magazine','Magazine'], ['#/festivals','Festivals'], ['#/methode','Notre méthode'] ];
let menuOpen = false;
function header(current){return `<header class="sitehead"><div class="container headinner"><a class="logo" href="#/" aria-label="BACKSTAGE, accueil">${esc(settings.brand || 'BACKSTAGE')}<span></span></a><nav class="nav ${menuOpen?'open':''}" aria-label="Navigation principale">${nav.map(([url,title])=>`<a href="${url}" ${current===url?'aria-current="page"':''}>${title}</a>`).join('')}<a class="headcta" href="#/professionnels">Espace professionnel <span aria-hidden="true">↗</span></a></nav><a class="headcta" href="#/professionnels">Espace professionnel <span aria-hidden="true">↗</span></a><button class="menu-toggle" id="menu-toggle" aria-expanded="${menuOpen}" aria-controls="mobile-nav">${menuOpen?'Fermer':'Menu ☰'}</button></div></header>`}
function footer(){const mail=settings.contactEmail?`<a href="mailto:${esc(settings.contactEmail)}">${esc(settings.contactEmail)}</a>`:'<span>Contact professionnel à configurer</span>';return `<footer class="footer"><div class="container"><div class="footer-grid"><div><a class="logo" href="#/">${esc(settings.brand||'BACKSTAGE')}<span></span></a><p>Média indépendant consacré aux concerts, aux festivals et aux cultures live. Sans frontières, sans fausses exclusivités.</p></div><div><h4>Explorer</h4><div class="footlinks"><a href="#/magazine">Magazine</a><a href="#/festivals">Festivals</a><a href="#/methode">Notre méthode</a></div></div><div><h4>Professionnels</h4><div class="footlinks"><a href="#/professionnels">Collaborations</a>${mail}${settings.instagramUrl?`<a href="${esc(ext(settings.instagramUrl))}" rel="noopener noreferrer" target="_blank">Instagram ↗</a>`:''}</div></div></div><div class="footer-bottom"><span>© ${new Date().getFullYear()} ${esc(settings.brand||'BACKSTAGE')} — Tous droits réservés.</span><span>Contenus originaux · Sources identifiées · Indépendance éditoriale</span></div></div></footer>`}
function media(a){return `<div class="article-media ${esc(a.visual||'visual-d')}"><div class="image-label">${esc(a.category||'MAGAZINE')}</div><span aria-hidden="true" class="image-type">${esc(a.artword||'LIVE')}</span></div>`}
function card(a){return `<a class="article-card" href="#/article/${encodeURIComponent(a.slug)}">${media(a)}<div class="article-text"><div class="article-meta">${esc(a.category)} <span>•</span> ${esc(prettyDate(a.date))}</div><h3 class="article-title">${esc(a.title)}</h3><p class="article-excerpt">${esc(a.excerpt)}</p><div class="card-bottom"><span>${Number(a.readMinutes)||3} min de lecture</span><span class="roundarrow" aria-hidden="true">↗</span></div></div></a>`}
function festCard(f){return `<article class="festcard"><div class="festtop"><span>${esc(f.country)}</span><span>${esc(f.code||'LIVE')}</span></div><div><h3>${esc(f.name)}</h3><p>${esc(f.city)} · ${esc(f.genres)}</p><a href="${esc(ext(f.url))}" target="_blank" rel="noopener noreferrer">Site officiel ↗</a></div></article>`}
function homescreen(){return `<section class="hero"><div class="container hero-grid"><div><div class="eyebrow">Le média des cultures live</div><h1>Le live,<br/><em>sans</em><br/>frontières.</h1><p class="hero-intro">Des scènes intimistes aux festivals qui font vibrer le monde. Actualités, découvertes et expériences : la musique se vit partout.</p><div class="hero-actions"><a class="btn btn-primary" href="#/magazine">Explorer le magazine <span aria-hidden="true">↗</span></a><a class="btn btn-secondary" href="#/festivals">Découvrir les festivals</a></div><div class="subnote"><span class="dot" aria-hidden="true"></span> Indépendant · Curieux · International</div></div><div class="hero-art" role="img" aria-label="Visuel graphique original évoquant les faisceaux lumineux d'un concert et une foule"><div class="stage-beams"><span class="beam one"></span><span class="beam two"></span><span class="beam three"></span></div><div class="crowd"></div><div class="art-top"><span>LIVE CULTURE JOURNAL</span><span>001 / ∞</span></div><div class="poster-word"><span>FEEL</span><span>THE</span><span>MUSIC.</span></div><div class="vertical-text">BE THERE. FEEL MORE.</div></div></div></section><div class="ticker"><div class="container tickerinner"><span>NO FRONTIERS</span><b>✳</b><span>ONLY LIVE MUSIC</span><b>✳</b><span>DISCOVER MORE</span><b>✳</b><span>FEEL EVERYTHING</span></div></div><section class="section"><div class="container"><div class="section-head"><div><span class="overline">L'édition du moment</span><h2>À la une<span style="color:var(--accent)">.</span></h2></div><a class="linkmore" href="#/magazine">Tous les articles ↗</a></div><div class="article-grid">${articles.slice(0,3).map(card).join('') || '<p class="empty">Premiers articles à venir.</p>'}</div></div></section><section class="section dark-band"><div class="container"><div class="section-head"><div><span class="overline">Le monde en musique</span><h2>Sur notre radar<span style="color:var(--accent)">.</span></h2></div><a class="linkmore" href="#/festivals">Tous les festivals ↗</a></div><div class="festival-grid">${festivals.slice(0,6).map(festCard).join('')}</div><p class="notice">Annuaire de découvertes : les dates et programmations doivent toujours être vérifiées sur les sites officiels. Aucune affiliation avec les festivals présentés n'est sous-entendue.</p></div></section><section class="section"><div class="container"><div class="section-head"><div><span class="overline">Notre ADN</span><h2>Vivre. Écouter. Raconter<span style="color:var(--accent)">.</span></h2></div></div>${methods()}</div></section>${proCall()}`}
function methods(){return `<div class="method-grid"><div class="method"><span class="num">01 /</span><h3>Le live d'abord.</h3><p>Les festivals se racontent aussi par leur ambiance, leur public et les découvertes hors des têtes d'affiche.</p></div><div class="method"><span class="num">02 /</span><h3>Des sources claires.</h3><p>Les annonces factuelles renvoient à leurs sources. Aucune interview ou présence sur place n'est inventée.</p></div><div class="method"><span class="num">03 /</span><h3>La curiosité partout.</h3><p>Des artistes émergents aux événements internationaux, aucune frontière géographique ne limite notre ligne éditoriale.</p></div></div>`}
function proCall(){return `<div class="container"><div class="pro-call"><div><span class="overline" style="color:#3f4c26">Festivals · Organisateurs · Partenaires</span><h2>Faisons vibrer la scène ensemble.</h2><p>Un média pour faire découvrir vos événements à un public passionné de musique live.</p></div><a href="#/professionnels" class="btn">Collaborer avec nous ↗</a></div></div>`}
function magazine(){return `<section class="container"><div class="page-heading"><span class="overline">Chroniques / idées / annonces sourcées</span><h1>Le magazine<span style="color:var(--accent)">.</span></h1><p>Des histoires et des informations utiles autour de la musique live. Nos articles de veille automatique sont vérifiés avant publication.</p><label for="search-articles" class="subnote">Rechercher un article</label><input class="search" id="search-articles" type="search" placeholder="Artiste, festival, sujet…" autocomplete="off" /></div><div id="article-results" class="article-grid" style="margin:5px 0 80px">${articles.map(card).join('')}</div></section>`}
function festivalsPage(){const countries=['Tous',...new Set(festivals.map(f=>f.country))];return `<section class="container"><div class="page-heading"><span class="overline">Une scène sans limites</span><h1>Les festivals<span style="color:var(--accent)">.</span></h1><p>Une sélection de festivals pour explorer les scènes d'ici et d'ailleurs. Les fiches renvoient directement aux sites officiels pour les informations actualisées.</p></div><div class="filterbar" id="country-filter">${countries.map((c,i)=>`<button class="chip ${i===0?'active':''}" data-country="${esc(c)}" aria-pressed="${i===0}">${esc(c)}</button>`).join('')}</div><div class="festival-grid" id="festival-results" style="margin-bottom:50px">${festivals.map(festCard).join('')}</div><p class="notice" style="margin-bottom:85px">Cette sélection n'indique ni dates ni disponibilités de billets. Consultez le site officiel de chaque événement.</p></section>`}
function methodPage(){return `<section class="container"><div class="page-heading"><span class="overline">Notre charte éditoriale</span><h1>Indépendants.<br/>Et responsables<span style="color:var(--accent)">.</span></h1><p>Nous utilisons l'automatisation pour mieux explorer la musique live, jamais pour fabriquer des faits.</p></div><div class="method-grid" style="margin:25px 0 60px">${methods().replace('<div class="method-grid">','').replace(/<\/div>$/,'')}</div><div class="pro-layout"><div class="pro-panel"><h3>Notre façon de travailler</h3><ul><li>Les annonces sont d'abord détectées sur des sources officielles.</li><li>L'IA peut préparer une synthèse, sans inventer de citations ou de détails.</li><li>Un responsable relit l'information et les liens d'origine avant publication.</li><li>Les corrections sont intégrées avec transparence.</li></ul></div><div class="pro-panel"><h3>Notre indépendance</h3><p>Une invitation ou une collaboration n'achète pas une critique favorable. Les partenariats éventuels sont signalés. Nous ne nous présentons jamais comme média accrédité par un événement sans accord réel.</p><p>Aucun compte-rendu « sur place » n'est publié si aucun membre de l'équipe n'y a assisté.</p></div></div></section>`}
function proPage(){const c = settings.contactEmail;return `<section class="container"><div class="page-heading"><span class="overline">Relations professionnelles</span><h1>Parlons musique,<br/>parlons projets<span style="color:var(--accent)">.</span></h1><p>Nous imaginons des collaborations éditoriales pertinentes autour des festivals, des événements et des artistes.</p></div><div class="pro-layout"><div class="pro-panel"><h3>Ce que nous pouvons proposer</h3><ul><li>Présentation d'une programmation à partir de sources officielles.</li><li>Portraits et découvertes d'artistes avec sources identifiées.</li><li>Guides pratiques et sélections éditoriales.</li><li>Couverture d'événement sur place, uniquement si elle est convenue et effectivement réalisée.</li></ul><p>Les livrables, délais et accès sont définis d'un commun accord selon les moyens réellement disponibles.</p></div><div class="pro-panel"><h3>Construisons une collaboration</h3><p>Organisateur, agence, salle ou festival : parlons de vos actualités et des formats qui apporteraient de la valeur au public.</p><div class="pro-contact">${c?`<p>Écrivez-nous pour discuter d'un projet :</p><a class="btn btn-primary" href="mailto:${esc(c)}?subject=${encodeURIComponent('Proposition de collaboration éditoriale')}">Prendre contact ↗</a>`:`<p>Coordonnées professionnelles en cours de configuration.</p><span class="hint">Le média est en préparation. Le contact sera publié au lancement.</span>`}</div><p class="notice">Toute invitation ou prise en charge en lien avec une publication sera indiquée, conformément à notre charte.</p></div></div></section>`}
function articlePage(slug){const a=articles.find(x=>x.slug===slug);if(!a)return `<div class="container page-heading"><h1>Article introuvable.</h1><p><a href="#/magazine">Retour au magazine</a></p></div>`;return `<article class="longread"><a href="#/magazine" class="back">← Retour au magazine</a><div class="article-meta" style="margin-top:30px">${esc(a.category)} <span>•</span> ${esc(prettyDate(a.date))} <span>•</span> ${Number(a.readMinutes)||3} min</div><h1>${esc(a.title)}</h1><p class="deck">${esc(a.excerpt)}</p>${media(a)}<div>${(a.body||[]).map(p=>`<p class="bodypara">${esc(p)}</p>`).join('')}</div><div class="sourcebox"><strong>À propos de cet article</strong><div>${esc(a.byline||'La rédaction')}</div>${a.sources?.length?`<div style="margin-top:10px">Sources d'origine : ${a.sources.filter(s=>s.url&&s.label).map(s=>`<a href="${esc(ext(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.label)} ↗</a>`).join(' · ')}</div>`:'<div>Article éditorial original, sans annonce externe.</div>'}</div></article>`}
function render(){const hash = decodeURIComponent(location.hash.replace(/^#/,'')) || '/';const current = hash.startsWith('/article/')?'#/magazine':`#${hash}`;let page = homescreen();if(hash==='/magazine')page=magazine();else if(hash==='/festivals')page=festivalsPage();else if(hash==='/methode')page=methodPage();else if(hash==='/professionnels')page=proPage();else if(hash.startsWith('/article/'))page=articlePage(hash.slice(9));app.innerHTML=header(current)+`<main id="main">${page}</main>`+footer();document.title = hash==='/'?`${settings.brand||'BACKSTAGE'} — Le live, sans frontières`:`${hash.startsWith('/article/')?(articles.find(a=>a.slug===hash.slice(9))?.title||'Article'):hash==='/magazine'?'Magazine':hash==='/festivals'?'Festivals':hash==='/methode'?'Notre méthode':'Professionnels'} | ${settings.brand||'BACKSTAGE'}`;document.getElementById('menu-toggle')?.addEventListener('click',()=>{menuOpen=!menuOpen;document.querySelector('.nav')?.classList.toggle('open',menuOpen);document.getElementById('menu-toggle').setAttribute('aria-expanded',String(menuOpen));document.getElementById('menu-toggle').textContent=menuOpen?'Fermer':'Menu ☰'});document.querySelectorAll('.nav a').forEach(e=>e.addEventListener('click',()=>menuOpen=false));const search=document.getElementById('search-articles');if(search) search.addEventListener('input',()=>{const term=search.value.trim().toLocaleLowerCase('fr');const matched=articles.filter(a=>[a.title,a.excerpt,a.category].join(' ').toLocaleLowerCase('fr').includes(term));document.getElementById('article-results').innerHTML=matched.length?matched.map(card).join(''):'<p class="empty">Aucun article pour cette recherche.</p>'});document.querySelectorAll('[data-country]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-country]').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});b.classList.add('active');b.setAttribute('aria-pressed','true');const c=b.getAttribute('data-country');const matched=festivals.filter(f=>c==='Tous'||f.country===c);document.getElementById('festival-results').innerHTML=matched.map(festCard).join('')}))}
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'})});render();
})();
</script>
</body>
</html>
