name: BACKSTAGE — validation du site
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin/**'
      - 'supabase/schema.sql'
      - 'scripts/relecture.py'
      - 'scripts/supabase_queue.py'
      - 'scripts/proposer_publication.py'
      - '.github/workflows/validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'redaction/validations/**'
      - '.github/workflows/validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe JavaScript du site
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m => m[1]);
          if (scripts.length < 2) throw new Error('Scripts du site absents');
          fs.writeFileSync('/tmp/backstage-scripts.js', scripts.join('\n'));
          console.log('Scripts extraits :',scripts.length);
          NODE
          node --check /tmp/backstage-scripts.js
      - name: Vérifier le JavaScript de la rédaction
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          h=Path('admin/index.html').read_text(encoding='utf8')
          m=re.search(r'<script type="module">([\s\S]+?)</script>',h)
          assert m, 'Module de rédaction absent'
          Path('/tmp/backstage-admin.mjs').write_text(m.group(1),encoding='utf8')
          assert 'VOTRE-PROJET' in Path('admin/config.js').read_text(encoding='utf8') or 'supabase.co' in Path('admin/config.js').read_text(encoding='utf8')
          PY
          node --check /tmp/backstage-admin.mjs
          node --check admin/config.js
      - name: Vérifier les scripts de publication
        run: |
          python -m pip install -q 'requests>=2.31,<3'
          python -m py_compile scripts/relecture.py scripts/supabase_queue.py scripts/proposer_publication.py
          python scripts/relecture.py --self-test
          python scripts/supabase_queue.py --self-test
      - name: Contrôler les liens éditoriaux et les catégories
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf8')
          m=re.search(r'window\.BACKSTAGE_CONTENT = (\{.*?\});</script>',h)
          assert m, 'Données des articles absentes'
          db=json.loads(m.group(1))
          assert len(db['articles']) >= 3
          for a in db['articles']:
              if a.get('format') in ('ACTUALITÉ','DÉCRYPTAGE'):
                  assert a.get('sources'), f"Sources manquantes : {a['slug']}"
              for s in a.get('sources',[]):
                  assert s['url'].startswith('https://'), 'Lien source non sécurisé'
          assert 'function dossiersPage()' in h
          assert 'function societePage()' in h
          slugs = [a['slug'] for a in db['articles']]
          assert len(set(slugs)) == len(slugs), 'Doublon de slug'
          for festival in db.get('festivals', []):
              lineup = festival.get('lineup', [])
              assert isinstance(lineup, list), 'Programmation invalide'
              if lineup:
                  assert festival.get('editionYear'), 'Année manquante'
                  for day in lineup:
                      assert day.get('day') and isinstance(day.get('artists'), list)
                      assert all(isinstance(x, str) and len(x)>1 for x in day['artists'])
          print('Programmation et liens vérifiés')
          print('Articles et catégories validés')
          PY
