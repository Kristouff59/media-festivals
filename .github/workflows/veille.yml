name: BACKSTAGE — radar musique live
on:
  workflow_dispatch:
concurrency:
  group: backstage-radar-main
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Vérifier le moteur de veille
        run: python scripts/veille.py --self-test
      - name: Détecter les sujets d'actualité
        run: python scripts/veille.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Vérifier le préparateur éditorial
        run: python scripts/preparer_articles.py --self-test
      - name: Préparer les fiches d'articles non publiées
        run: python scripts/preparer_articles.py
      - name: Sauvegarder les candidats pour la rédaction
        run: |
          mkdir -p /tmp/backstage-radar-data
          cp -a data/. /tmp/backstage-radar-data/
      - name: Tester le contrôle automatique des articles
        run: python scripts/proposer_publication.py --self-test
      - name: Rédiger et recouper une proposition d'article
        run: python scripts/proposer_publication.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Contrôler la syntaxe du magazine après rédaction
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m => m[1]);
          if (scripts.length < 2) throw new Error('Scripts du site absents');
          fs.writeFileSync('/tmp/backstage-editorial.js', scripts.join('\n'));
          NODE
          node --check /tmp/backstage-editorial.js
      - name: Vérifier le système de relecture et de décision
        run: |
          python scripts/relecture.py --self-test
          python scripts/decision_publication.py --self-test
          python scripts/supabase_queue.py --self-test
      - name: Envoyer le texte complet à l'éditeur et l'avertir
        run: python scripts/relecture.py --offer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKSTAGE_EDITOR: Kristouff59
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BACKSTAGE_ALERT_EMAIL: ${{ secrets.BACKSTAGE_ALERT_EMAIL }}
          BACKSTAGE_FROM_EMAIL: ${{ secrets.BACKSTAGE_FROM_EMAIL }}
          BACKSTAGE_SITE_URL: ${{ vars.BACKSTAGE_SITE_URL }}
      - name: Restaurer les fichiers de veille après la proposition d'article
        run: |
          mkdir -p data
          cp -a /tmp/backstage-radar-data/. data/
      - name: Archiver la veille directement, sans demande de validation
        shell: bash
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée de veille"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'radar: mémoriser les nouvelles pistes'
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            echo "::warning::Échec de fusion de données de veille : mise en concurrence détectée. La prochaine exécution reprendra la veille."
            exit 0
          fi
          git push origin HEAD:main
