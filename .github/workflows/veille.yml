name: BACKSTAGE — radar musique live
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/sources.json'
      - 'scripts/veille.py'
      - 'scripts/preparer_articles.py'
      - 'scripts/proposer_publication.py'
      - '.github/workflows/veille.yml'
  schedule:
    - cron: '17 7,18 * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Vérifier le moteur de veille
        run: python scripts/veille.py --self-test
      - name: Détecter les sujets d'actualité
        run: python scripts/veille.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Vérifier le préparateur éditorial
        run: python scripts/preparer_articles.py --self-test
      - name: Préparer les fiches d'articles non publiées
        run: python scripts/preparer_articles.py
      - name: Sauvegarder les candidats pour la rédaction
        run: |
          mkdir -p /tmp/backstage-radar-data
          cp -a data/. /tmp/backstage-radar-data/
      - name: Tester le contrôle automatique des articles
        run: python scripts/proposer_publication.py --self-test
      - name: Rédiger et recouper une proposition d'article
        run: python scripts/proposer_publication.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Contrôler la syntaxe du magazine après rédaction
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m => m[1]);
          if (scripts.length < 2) throw new Error('Scripts du site absents');
          fs.writeFileSync('/tmp/backstage-editorial.js', scripts.join('\n'));
          NODE
          node --check /tmp/backstage-editorial.js
      - name: Soumettre l'article validé techniquement pour approbation
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/article-a-publier
          delete-branch: true
          title: 'BACKSTAGE — article prêt à approuver'
          commit-message: 'rédaction: proposer un article vérifié et prêt à publier'
          body: |
            Proposition d'article mise en forme dans index.html.
            Les extraits factuels ont été retrouvés sur une page de source primaire.
            Un contrôle automatique réduit le risque d'erreur, mais n'est pas infaillible.
            Fusionner = publier l'article. Fermer = rejeter.
            Les sources restent visibles discrètement sous l'article.
          add-paths: |
            index.html
            redaction/validations/*.md
      - name: Restaurer les fichiers de veille après la proposition d'article
        run: |
          mkdir -p data
          cp -a /tmp/backstage-radar-data/. data/
      - name: Proposer la sélection à relire
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/radar-musique-live
          delete-branch: true
          title: 'BACKSTAGE — nouvelles pistes éditoriales à vérifier'
          commit-message: 'radar: préparer des sujets musique live à vérifier'
          body: |
            Ce dossier contient des sujets repérés par des flux d'agrégation.
            Ces titres ne sont PAS des faits vérifiés : vérifier les sources primaires.
            Ne pas reprendre le texte des médias. Aucune publication automatique.
            Les fiches proposées dans data/brouillons contiennent des plans et des
            vérifications à mener, pas des articles prêts à publier.
            Fusionner pour enregistrer les titres déjà vus et éviter les doublons.
          add-paths: data/
